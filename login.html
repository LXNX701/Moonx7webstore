<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MoonX7 Store | Acceso Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
    <script src="js/supabase.js"></script>
    <style>
        * { font-family: 'Inter', sans-serif; }
        body { background: linear-gradient(135deg, #0a0a0a 0%, #0f0f0f 100%); }
        .glass-card {
            background: rgba(20, 20, 25, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 87, 26, 0.2);
            border-radius: 24px;
        }
        input { transition: all 0.3s ease; }
        input:focus { border-color: #ff571a !important; outline: none; box-shadow: 0 0 0 2px rgba(255, 87, 26, 0.2); }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">

<div class="glass-card p-8 w-full max-w-md">
    <div class="text-center mb-8">
        <div class="w-16 h-16 mx-auto mb-4 rounded-full bg-gradient-to-r from-orange-500 to-red-600 flex items-center justify-center">
            <span class="text-2xl font-bold">🌙</span>
        </div>
        <h1 class="text-2xl font-bold text-white">Acceso Administrador</h1>
        <p class="text-zinc-400 text-sm mt-1">Ingresa tus credenciales</p>
    </div>
    
    <form id="loginForm">
        <div class="mb-5">
            <label class="block text-sm font-medium mb-2 text-zinc-300">Correo electrónico</label>
            <input type="email" id="email" required class="w-full bg-zinc-900 border border-zinc-700 rounded-xl p-3 text-white" placeholder="admin@moonx7.com">
        </div>
        
        <div class="mb-6">
            <label class="block text-sm font-medium mb-2 text-zinc-300">Contraseña</label>
            <input type="password" id="password" required class="w-full bg-zinc-900 border border-zinc-700 rounded-xl p-3 text-white" placeholder="••••••••">
        </div>
        
        <div id="errorMessage" class="mb-4 text-red-500 text-sm text-center hidden"></div>
        
        <button type="submit" id="loginBtn" class="w-full bg-gradient-to-r from-orange-500 to-red-600 py-3 rounded-xl text-white font-bold text-lg transition hover:scale-[1.02]">
            Ingresar al Panel
        </button>
    </form>
</div>

<script>
    const form = document.getElementById('loginForm');
    const errorDiv = document.getElementById('errorMessage');
    const loginBtn = document.getElementById('loginBtn');
    
    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        
        errorDiv.classList.add('hidden');
        loginBtn.disabled = true;
        loginBtn.textContent = 'Verificando...';
        
        const { data, error } = await window.m7Supabase.auth.signInWithPassword({
            email: email,
            password: password
        });
        
        if (error) {
            errorDiv.textContent = '❌ ' + (error.message === 'Invalid login credentials' ? 'Credenciales incorrectas' : error.message);
            errorDiv.classList.remove('hidden');
            loginBtn.disabled = false;
            loginBtn.textContent = 'Ingresar al Panel';
            return;
        }
        
        if (data.user) {
            window.location.href = 'dashboard.html';
        }
    });
</script>
</body>
</html>
