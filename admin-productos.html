<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MoonX7 Store | Inventario</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
    <script src="js/supabase.js"></script>
    <style>
        * { font-family: 'Inter', sans-serif; }
        body { background: #0a0a0a; }
        .glass-card {
            background: rgba(20, 20, 25, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 87, 26, 0.15);
            border-radius: 20px;
        }
    </style>
</head>
<body>

<div id="app" class="flex">
    <aside class="w-64 min-h-screen bg-black/50 border-r border-zinc-800 p-5 fixed left-0 top-0">
        <div class="flex items-center gap-2 mb-8 pb-4 border-b border-zinc-800">
            <div class="w-8 h-8 rounded-full bg-gradient-to-r from-orange-500 to-red-600 flex items-center justify-center">
                <span class="text-sm font-bold">🌙</span>
            </div>
            <span class="text-xl font-bold bg-gradient-to-r from-orange-500 to-red-600 bg-clip-text text-transparent">MoonX7</span>
        </div>
        <nav class="space-y-2">
            <a href="dashboard.html" class="sidebar-link flex items-center gap-3 px-4 py-3 text-zinc-400 hover:bg-orange-500/10 rounded-xl transition">📊 Panel Central</a>
            <a href="admin-pedidos.html" class="sidebar-link flex items-center gap-3 px-4 py-3 text-zinc-400 hover:bg-orange-500/10 rounded-xl transition">📋 Órdenes</a>
            <a href="admin-productos.html" class="sidebar-link flex items-center gap-3 px-4 py-3 bg-orange-500/10 text-orange-500 rounded-xl font-medium">📦 Inventario</a>
        </nav>
        <button id="logoutBtn" class="mt-auto absolute bottom-5 left-5 right-5 flex items-center justify-center gap-2 px-4 py-3 bg-red-600/20 text-red-400 rounded-xl hover:bg-red-600/30 transition">🚪 Cerrar Sesión</button>
    </aside>
    
    <main class="ml-64 flex-1 p-8">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-3xl font-bold">📦 Gestión de Productos</h1>
            <button id="addProductBtn" class="bg-gradient-to-r from-orange-500 to-red-600 px-5 py-2 rounded-xl text-white font-medium flex items-center gap-2 hover:scale-105 transition">
                <span class="material-symbols-outlined">add</span> Añadir Mod
            </button>
        </div>
        
        <div id="productsContainer" class="space-y-3"></div>
    </main>
</div>

<script>
    // Verificar autenticación
    window.m7Supabase.auth.getSession().then(({ data: { session } }) => {
        if (!session) window.location.href = 'login.html';
    });
    
    async function loadProducts() {
        const { data, error } = await window.m7Supabase.from('products').select('*').order('id');
        if (error) return;
        
        const container = document.getElementById('productsContainer');
        if (!data || data.length === 0) {
            container.innerHTML = '<div class="glass-card p-8 text-center text-zinc-500">No hay productos registrados</div>';
            return;
        }
        
        container.innerHTML = data.map(product => `
            <div class="glass-card p-4 flex flex-wrap items-center justify-between gap-4">
                <div class="flex items-center gap-4 flex-1">
                    <img src="${product.image || 'https://placehold.co/60x60/1a1a1a/ff571a'}" class="w-12 h-12 rounded-lg object-cover">
                    <div>
                        <h3 class="font-bold text-white">${product.name}</h3>
                        <p class="text-sm text-zinc-400">${product.category || 'Software'} - $${product.price}</p>
                    </div>
                </div>
                <button onclick="deleteProduct(${product.id})" class="bg-red-600/20 text-red-400 px-4 py-2 rounded-lg text-sm hover:bg-red-600/30 transition flex items-center gap-2">
                    <span class="material-symbols-outlined text-sm">delete</span> Eliminar
                </button>
            </div>
        `).join('');
    }
    
    window.deleteProduct = async (id) => {
        if (confirm('¿Eliminar este producto permanentemente?')) {
            await window.m7Supabase.from('products').delete().eq('id', id);
            loadProducts();
        }
    };
    
    document.getElementById('addProductBtn').addEventListener('click', () => {
        const name = prompt('Nombre del producto:');
        if (!name) return;
        
        const price = parseFloat(prompt('Precio en USD:'));
        if (isNaN(price)) return;
        
        const category = prompt('Categoría (ej: Mods, Software, Hardware):', 'Mods');
        const description = prompt('Descripción del producto:');
        const image = prompt('URL de la imagen (opcional):', 'https://placehold.co/400x300/1a1a1a/ff571a');
        const hot = confirm('¿Marcar como HOT?');
        
        window.m7Supabase.from('products').insert([{
            name, price, category, description, image, hot
        }]).then(() => loadProducts());
    });
    
    document.getElementById('logoutBtn').addEventListener('click', async () => {
        await window.m7Supabase.auth.signOut();
        window.location.href = 'index.html';
    });
    
    loadProducts();
</script>
</body>
</html>
