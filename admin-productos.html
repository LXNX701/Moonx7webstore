<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>MoonX7 | Panel de Control</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
    <script src="js/supabase.js"></script>
    <style>
        * { font-family: 'Inter', sans-serif; margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0a0a0a; overflow-x: hidden; }
        
        /* Sidebar para móvil */
        .sidebar {
            position: fixed;
            left: -280px;
            top: 0;
            width: 280px;
            height: 100vh;
            background: #0a0a0a;
            border-right: 1px solid #1f1f2a;
            transition: left 0.3s ease;
            z-index: 100;
            padding: 24px;
        }
        .sidebar.open { left: 0; }
        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.7);
            z-index: 99;
            display: none;
        }
        .overlay.active { display: block; }
        
        /* Desktop sidebar */
        @media (min-width: 768px) {
            .sidebar { left: 0; width: 260px; }
            .menu-toggle { display: none; }
            .overlay { display: none !important; }
            main { margin-left: 260px; }
        }
        
        /* Cards y estilos */
        .stat-card {
            background: linear-gradient(135deg, #0f0f1a, #0a0a0f);
            border: 1px solid rgba(255, 87, 26, 0.15);
            border-radius: 20px;
            transition: all 0.3s;
        }
        .stat-card:hover { border-color: #ff571a; transform: translateY(-2px); }
        
        .product-card {
            background: rgba(15, 15, 26, 0.8);
            border: 1px solid rgba(255, 87, 26, 0.1);
            border-radius: 16px;
            transition: all 0.3s;
        }
        .product-card:hover { border-color: rgba(255, 87, 26, 0.4); background: rgba(20, 20, 30, 0.9); }
        
        .btn-primary { background: linear-gradient(135deg, #ff571a 0%, #ff2d00 100%); transition: all 0.3s; }
        .btn-primary:hover { transform: scale(1.02); box-shadow: 0 5px 20px rgba(255, 87, 26, 0.3); }
        .btn-secondary { background: rgba(255, 255, 255, 0.08); transition: all 0.3s; }
        .btn-secondary:hover { background: rgba(255, 87, 26, 0.2); }
        
        input, select, textarea {
            background: #0a0a0a;
            border: 1px solid #1f1f2a;
            border-radius: 12px;
            padding: 12px 16px;
            color: white;
            width: 100%;
            transition: all 0.3s;
        }
        input:focus, select:focus, textarea:focus {
            border-color: #ff571a;
            outline: none;
            box-shadow: 0 0 0 2px rgba(255, 87, 26, 0.2);
        }
        label { font-size: 0.875rem; font-weight: 500; color: #9ca3af; margin-bottom: 6px; display: block; }
        
        .modal {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.9);
            backdrop-filter: blur(8px);
            z-index: 200;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .modal.active { display: flex; }
        .modal-content {
            background: #111118;
            border: 1px solid #1f1f2a;
            border-radius: 24px;
            width: 100%;
            max-width: 550px;
            max-height: 90vh;
            overflow-y: auto;
            padding: 24px;
        }
        
        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #0a0a0a; }
        ::-webkit-scrollbar-thumb { background: #ff571a; border-radius: 4px; }
        
        /* Badge HOT */
        .badge-hot { background: linear-gradient(135deg, #ff571a, #ff2d00); font-size: 10px; padding: 2px 8px; border-radius: 20px; color: white; }
    </style>
</head>
<body>

<!-- Botón menú móvil -->
<button class="menu-toggle fixed top-5 left-4 z-50 md:hidden bg-zinc-900 p-2 rounded-xl border border-zinc-700" onclick="toggleSidebar()">
    <span class="material-symbols-outlined text-white">menu</span>
</button>

<!-- Sidebar -->
<aside class="sidebar" id="sidebar">
    <div class="flex items-center justify-between mb-8 pb-6 border-b border-zinc-800">
        <div class="flex items-center gap-2">
            <div class="w-9 h-9 rounded-full bg-gradient-to-r from-orange-500 to-red-600 flex items-center justify-center">🌙</div>
            <span class="text-xl font-bold bg-gradient-to-r from-orange-500 to-red-600 bg-clip-text text-transparent">MoonX7</span>
        </div>
        <button class="md:hidden text-zinc-400" onclick="toggleSidebar()">✕</button>
    </div>
    <nav class="space-y-1">
        <a href="dashboard.html" class="flex items-center gap-3 px-4 py-3 text-zinc-400 hover:bg-orange-500/10 hover:text-orange-500 rounded-xl transition">📊 Dashboard</a>
        <a href="admin-productos.html" class="flex items-center gap-3 px-4 py-3 bg-orange-500/10 text-orange-500 rounded-xl font-medium transition">📦 Productos</a>
        <a href="admin-pedidos.html" class="flex items-center gap-3 px-4 py-3 text-zinc-400 hover:bg-orange-500/10 hover:text-orange-500 rounded-xl transition">📋 Pedidos</a>
    </nav>
    <button id="logoutBtn" class="absolute bottom-6 left-6 right-6 flex items-center justify-center gap-2 px-4 py-3 bg-red-600/20 text-red-400 rounded-xl hover:bg-red-600/30 transition mt-8">🚪 Cerrar Sesión</button>
</aside>

<div class="overlay" id="overlay" onclick="toggleSidebar()"></div>

<!-- Main Content -->
<main class="p-4 md:p-8 pb-24">
    <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-6">
        <div>
            <h1 class="text-2xl md:text-3xl font-bold text-white">Gestión de Productos</h1>
            <p class="text-zinc-500 text-sm mt-1">Administra tu catálogo de productos</p>
        </div>
        <button id="addProductBtn" class="btn-primary px-5 py-2.5 rounded-xl text-white font-medium flex items-center gap-2 w-full md:w-auto justify-center">
            <span class="material-symbols-outlined text-lg">add</span> Nuevo Producto
        </button>
    </div>

    <!-- Stats Cards -->
    <div class="grid grid-cols-2 md:grid-cols-4 gap-3 md:gap-5 mb-6">
        <div class="stat-card p-4 text-center"><p class="text-zinc-500 text-xs">Total</p><p class="text-2xl font-bold text-white" id="totalProducts">0</p></div>
        <div class="stat-card p-4 text-center"><p class="text-zinc-500 text-xs">Valor</p><p class="text-2xl font-bold text-orange-500" id="totalValue">$0</p></div>
        <div class="stat-card p-4 text-center"><p class="text-zinc-500 text-xs">Stock</p><p class="text-2xl font-bold text-white" id="totalStock">0</p></div>
        <div class="stat-card p-4 text-center"><p class="text-zinc-500 text-xs">HOT</p><p class="text-2xl font-bold text-orange-500" id="hotCount">0</p></div>
    </div>

    <!-- Products List -->
    <div class="flex justify-between items-center mb-4">
        <h2 class="text-lg font-bold text-white">📦 Inventario</h2>
        <span class="text-xs text-zinc-500" id="itemCount">0 items</span>
    </div>
    <div id="productsGrid" class="space-y-3"></div>
</main>

<!-- Modal -->
<div id="productModal" class="modal">
    <div class="modal-content">
        <div class="flex justify-between items-center mb-5">
            <h2 id="modalTitle" class="text-xl font-bold text-orange-500">Agregar Producto</h2>
            <button onclick="closeModal()" class="text-zinc-400 hover:text-white text-2xl leading-none">✕</button>
        </div>
        
        <form id="productForm" class="space-y-4">
            <input type="hidden" id="productId">
            
            <div>
                <label>📌 Nombre del Producto *</label>
                <input type="text" id="prodName" required placeholder="Ej: Mod Menu Pro">
            </div>
            
            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label>💰 Precio (USD)</label>
                    <input type="number" id="prodPrice" step="0.01" required placeholder="0.00">
                </div>
                <div>
                    <label>📦 Stock</label>
                    <input type="number" id="prodStock" value="100" placeholder="Cantidad">
                </div>
            </div>
            
            <div>
                <label>🏷️ Categoría (escribe lo que quieras)</label>
                <input type="text" id="prodCategory" placeholder="Ej: Mods, Software, Security, Bundle...">
                <p class="text-xs text-zinc-500 mt-1">Puedes escribir cualquier categoría personalizada</p>
            </div>
            
            <div>
                <label>📝 Descripción</label>
                <textarea id="prodDesc" rows="3" placeholder="Describe el producto..."></textarea>
            </div>
            
            <div>
                <label>🖼️ URL de Imagen</label>
                <input type="url" id="prodImage" placeholder="https://...">
            </div>
            
            <div class="flex items-center gap-3">
                <input type="checkbox" id="prodHot" class="w-5 h-5 accent-orange-500">
                <label class="text-sm text-zinc-300">🔥 Marcar como HOT (destacar en catálogo)</label>
            </div>
            
            <button type="submit" class="btn-primary w-full py-3 rounded-xl text-white font-bold">💾 Guardar Producto</button>
        </form>
    </div>
</div>

<script>
    window.m7Supabase.auth.getSession().then(({ data: { session } }) => { if (!session) location.href = 'login.html'; });
    
    function toggleSidebar() {
        document.getElementById('sidebar').classList.toggle('open');
        document.getElementById('overlay').classList.toggle('active');
    }
    
    async function loadProducts() {
        const { data } = await window.m7Supabase.from('products').select('*').order('id');
        if (!data) return;
        
        const total = data.length;
        const totalStock = data.reduce((s, p) => s + (p.stock || 0), 0);
        const totalValue = data.reduce((s, p) => s + ((p.price || 0) * (p.stock || 0)), 0);
        const hotCount = data.filter(p => p.hot).length;
        
        document.getElementById('totalProducts').textContent = total;
        document.getElementById('totalStock').textContent = totalStock;
        document.getElementById('totalValue').textContent = `$${totalValue.toFixed(2)}`;
        document.getElementById('hotCount').textContent = hotCount;
        document.getElementById('itemCount').textContent = `${total} items`;
        
        const grid = document.getElementById('productsGrid');
        if (!data.length) { grid.innerHTML = '<div class="text-center text-zinc-500 py-10">No hay productos aún. Crea uno nuevo.</div>'; return; }
        
        grid.innerHTML = data.map(p => `
            <div class="product-card p-4 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                <div class="flex items-center gap-3 flex-1">
                    <img src="${p.image || 'https://placehold.co/50x50/1a1a1a/ff571a?text=Img'}" class="w-12 h-12 rounded-lg object-cover bg-zinc-800">
                    <div class="flex-1">
                        <div class="flex flex-wrap items-center gap-2">
                            <h3 class="font-bold text-white text-sm md:text-base">${escapeHtml(p.name)}</h3>
                            ${p.hot ? '<span class="badge-hot">HOT</span>' : ''}
                        </div>
                        <p class="text-xs text-zinc-400">${escapeHtml(p.category || 'Sin categoría')} • Stock: ${p.stock || 0} • $${p.price}</p>
                        <p class="text-xs text-zinc-500 line-clamp-1">${escapeHtml(p.description || '').substring(0, 80)}</p>
                    </div>
                </div>
                <div class="flex gap-2 ml-14 sm:ml-0">
                    <button onclick="editProduct(${p.id})" class="bg-orange-600/20 text-orange-400 px-4 py-2 rounded-lg text-sm hover:bg-orange-600/30">✏️ Editar</button>
                    <button onclick="deleteProduct(${p.id})" class="bg-red-600/20 text-red-400 px-4 py-2 rounded-lg text-sm hover:bg-red-600/30">🗑️</button>
                </div>
            </div>
        `).join('');
    }
    
    function escapeHtml(str) { if (!str) return ''; return str.replace(/[&<>]/g, function(m) { if (m === '&') return '&amp;'; if (m === '<') return '&lt;'; if (m === '>') return '&gt;'; return m; }); }
    
    window.editProduct = async (id) => {
        const { data } = await window.m7Supabase.from('products').select('*').eq('id', id).single();
        document.getElementById('productId').value = data.id;
        document.getElementById('prodName').value = data.name || '';
        document.getElementById('prodPrice').value = data.price || '';
        document.getElementById('prodStock').value = data.stock || 100;
        document.getElementById('prodCategory').value = data.category || '';
        document.getElementById('prodDesc').value = data.description || '';
        document.getElementById('prodImage').value = data.image || '';
        document.getElementById('prodHot').checked = data.hot || false;
        document.getElementById('modalTitle').textContent = 'Editar Producto';
        document.getElementById('productModal').classList.add('active');
    };
    
    window.deleteProduct = async (id) => { if (confirm('¿Eliminar este producto permanentemente?')) { await window.m7Supabase.from('products').delete().eq('id', id); loadProducts(); } };
    
    document.getElementById('addProductBtn').onclick = () => {
        document.getElementById('productForm').reset();
        document.getElementById('productId').value = '';
        document.getElementById('prodHot').checked = false;
        document.getElementById('modalTitle').textContent = 'Agregar Producto';
        document.getElementById('productModal').classList.add('active');
    };
    
    document.getElementById('productForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const data = {
            name: document.getElementById('prodName').value,
            price: parseFloat(document.getElementById('prodPrice').value),
            category: document.getElementById('prodCategory').value || 'Sin categoría',
            description: document.getElementById('prodDesc').value,
            image: document.getElementById('prodImage').value,
            hot: document.getElementById('prodHot').checked,
            stock: parseInt(document.getElementById('prodStock').value) || 0
        };
        const id = document.getElementById('productId').value;
        if (id) await window.m7Supabase.from('products').update(data).eq('id', id);
        else await window.m7Supabase.from('products').insert([data]);
        closeModal(); loadProducts();
    });
    
    function closeModal() { document.getElementById('productModal').classList.remove('active'); }
    document.getElementById('logoutBtn').onclick = async () => { await window.m7Supabase.auth.signOut(); location.href = 'index.html'; };
    
    loadProducts();
</script>
</body>
</html>
