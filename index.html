<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MoonX7 Store | Catálogo de Mods y Software</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
    <script src="js/supabase.js"></script>
    <style>
        * { font-family: 'Inter', sans-serif; }
        body { background: #0a0a0a; }
        .glass-card {
            background: rgba(20, 20, 25, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 87, 26, 0.15);
            transition: all 0.3s ease;
        }
        .glass-card:hover {
            border-color: #ff571a;
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(255, 87, 26, 0.15);
        }
        .btn-primary {
            background: linear-gradient(135deg, #ff571a 0%, #ff2d00 100%);
            transition: all 0.3s ease;
        }
        .btn-primary:hover {
            transform: scale(1.02);
            box-shadow: 0 5px 20px rgba(255, 87, 26, 0.4);
        }
        .cart-badge {
            position: absolute;
            top: -8px;
            right: -8px;
            background: #ff571a;
            color: white;
            font-size: 11px;
            font-weight: bold;
            min-width: 18px;
            height: 18px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 5px;
        }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #1a1a1a; }
        ::-webkit-scrollbar-thumb { background: #ff571a; border-radius: 4px; }
        .search-input:focus { border-color: #ff571a; outline: none; box-shadow: 0 0 0 2px rgba(255, 87, 26, 0.2); }
    </style>
</head>
<body class="bg-black text-gray-200">

<!-- Navbar -->
<nav class="fixed top-0 left-0 right-0 z-50 bg-black/90 backdrop-blur-md border-b border-zinc-800">
    <div class="max-w-7xl mx-auto px-4 md:px-8">
        <div class="flex items-center justify-between h-16">
            <div class="flex items-center gap-2 cursor-pointer" onclick="location.href='index.html'">
                <div class="w-8 h-8 rounded-full bg-gradient-to-r from-orange-500 to-red-600 flex items-center justify-center">
                    <span class="text-sm font-bold">🌙</span>
                </div>
                <span class="text-xl font-bold bg-gradient-to-r from-orange-500 to-red-600 bg-clip-text text-transparent">MoonX7</span>
            </div>
            
            <div class="flex items-center gap-6">
                <div class="relative">
                    <button onclick="location.href='compra.html'" class="relative p-2 hover:bg-zinc-800 rounded-full transition">
                        <span class="material-symbols-outlined text-orange-500">shopping_cart</span>
                        <span id="cartCount" class="cart-badge hidden">0</span>
                    </button>
                </div>
                <button onclick="location.href='login.html'" class="text-sm text-zinc-400 hover:text-orange-500 transition flex items-center gap-1">
                    <span class="material-symbols-outlined text-sm">admin_panel_settings</span>
                    Admin
                </button>
            </div>
        </div>
    </div>
</nav>

<!-- Hero Section -->
<section class="relative pt-24 pb-12 px-4">
    <div class="max-w-7xl mx-auto text-center">
        <div class="inline-flex items-center gap-2 bg-orange-500/10 px-4 py-2 rounded-full border border-orange-500/20 mb-6">
            <span class="w-2 h-2 bg-orange-500 rounded-full animate-pulse"></span>
            <span class="text-xs text-orange-400 font-medium">🔥 OFERTAS ESPECIALES 🔥</span>
        </div>
        <h1 class="text-5xl md:text-7xl font-black mb-4">
            <span class="bg-gradient-to-r from-orange-500 to-red-600 bg-clip-text text-transparent">MoonX7</span>
        </h1>
        <p class="text-zinc-400 text-lg max-w-2xl mx-auto">Los mejores mods, software y herramientas para tu experiencia gaming</p>
    </div>
</section>

<!-- Buscador -->
<div class="max-w-7xl mx-auto px-4 mb-8">
    <div class="relative max-w-md mx-auto">
        <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-zinc-500 text-xl">search</span>
        <input type="text" id="searchInput" placeholder="Buscar productos..." class="search-input w-full bg-zinc-900/50 border border-zinc-800 rounded-2xl py-3 pl-12 pr-4 text-white focus:border-orange-500 transition">
    </div>
</div>

<!-- Grid de Productos -->
<div class="max-w-7xl mx-auto px-4 pb-16">
    <div id="productsGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6"></div>
    <div id="loadingProducts" class="text-center py-20 text-zinc-500">Cargando productos...</div>
</div>

<!-- Footer -->
<footer class="border-t border-zinc-800 py-8 text-center text-zinc-500 text-sm">
    <p>© 2025 MoonX7 Store - Todos los derechos reservados</p>
</footer>

<script>
    // ============ CARRITO EN LOCALSTORAGE ============
    let cart = JSON.parse(localStorage.getItem('m7_cart') || '[]');
    
    function updateCartBadge() {
        const count = cart.reduce((sum, item) => sum + item.quantity, 0);
        const badge = document.getElementById('cartCount');
        if (count > 0) {
            badge.textContent = count;
            badge.classList.remove('hidden');
        } else {
            badge.classList.add('hidden');
        }
    }
    
    function addToCart(product) {
        const existing = cart.find(item => item.id === product.id);
        if (existing) {
            existing.quantity += 1;
        } else {
            cart.push({ ...product, quantity: 1 });
        }
        localStorage.setItem('m7_cart', JSON.stringify(cart));
        updateCartBadge();
        
        // Notificación flotante
        const toast = document.createElement('div');
        toast.className = 'fixed bottom-4 right-4 bg-orange-500 text-black px-4 py-2 rounded-xl font-medium z-50 animate-pulse';
        toast.innerHTML = '✅ ' + product.name + ' agregado';
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 2000);
    }
    
    // ============ CARGAR PRODUCTOS DESDE SUPABASE ============
    async function loadProducts(searchTerm = '') {
        const grid = document.getElementById('productsGrid');
        const loading = document.getElementById('loadingProducts');
        
        loading.classList.remove('hidden');
        grid.innerHTML = '';
        
        let query = window.m7Supabase.from('products').select('*').order('id');
        if (searchTerm) {
            query = query.ilike('name', `%${searchTerm}%`);
        }
        
        const { data: products, error } = await query;
        
        loading.classList.add('hidden');
        
        if (error) {
            console.error(error);
            grid.innerHTML = '<div class="col-span-full text-center text-red-500 py-20">Error al cargar productos</div>';
            return;
        }
        
        if (!products || products.length === 0) {
            grid.innerHTML = '<div class="col-span-full text-center text-zinc-500 py-20">No se encontraron productos</div>';
            return;
        }
        
        grid.innerHTML = products.map(product => `
            <div class="glass-card rounded-2xl overflow-hidden group">
                <div class="relative h-48 overflow-hidden">
                    <img src="${product.image || 'https://placehold.co/400x300/1a1a1a/ff571a?text=MoonX7'}" alt="${product.name}" class="w-full h-full object-cover group-hover:scale-110 transition duration-500">
                    ${product.hot ? '<div class="absolute top-3 left-3 bg-gradient-to-r from-orange-500 to-red-600 text-white text-xs px-2 py-1 rounded-full font-bold">🔥 HOT</div>' : ''}
                </div>
                <div class="p-5">
                    <div class="flex justify-between items-start mb-2">
                        <h3 class="font-bold text-lg text-white">${product.name}</h3>
                        <span class="text-orange-500 font-bold">$${product.price}</span>
                    </div>
                    <p class="text-zinc-400 text-sm mb-4 line-clamp-2">${product.description || 'Sin descripción'}</p>
                    <button onclick='addToCart(${JSON.stringify(product).replace(/'/g, "\\'")})' class="btn-primary w-full py-2 rounded-xl text-white font-medium flex items-center justify-center gap-2">
                        <span class="material-symbols-outlined text-sm">add_shopping_cart</span>
                        Agregar
                    </button>
                </div>
            </div>
        `).join('');
    }
    
    // ============ INICIALIZACIÓN ============
    updateCartBadge();
    loadProducts();
    
    document.getElementById('searchInput').addEventListener('input', (e) => {
        loadProducts(e.target.value);
    });
</script>
</body>
</html>
